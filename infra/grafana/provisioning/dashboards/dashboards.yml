# =====================================================================
# CX-ORBIT — Grafana dashboard provider (Phase 1)
# Loads any dashboard JSON dropped into /var/lib/grafana/dashboards.
# =====================================================================
apiVersion: 1

providers:
  - name: cx-orbit
    orgId: 1
    folder: CX-ORBIT
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
