# =====================================================================
# CX-ORBIT — OpenTelemetry Collector configuration (optional)
#
# Enabled only with:  docker compose --profile tracing up -d
# Receives OTLP traces/metrics from services and (for the local lab)
# exports them to the collector's own logs. Wire an exporter (Tempo,
# Jaeger, etc.) here when a trace backend is added.
# =====================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25

exporters:
  debug:
    verbosity: normal
  # prometheus exporter exposes collected metrics for Prometheus to scrape.
  prometheus:
    endpoint: 0.0.0.0:8889

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
