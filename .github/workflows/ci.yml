name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.29.3
  NODE_VERSION: 22

jobs:
  quality:
    name: Lint · Typecheck · Unit · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

      - name: Dependency audit (non-blocking advisories)
        run: pnpm audit --prod --audit-level=critical || true

  integration:
    name: Integration (Mongo · Postgres · Redis · NATS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter @cx-orbit/shared build && pnpm --filter @cx-orbit/platform build

      - name: Start infra
        run: docker compose up -d mongo postgres redis nats

      - name: Wait for infra
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if docker compose exec -T mongo mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' \
              && docker compose exec -T redis redis-cli ping | grep -q PONG \
              && docker compose exec -T postgres pg_isready -U cxorbit \
              && curl -sf http://localhost:8222/healthz >/dev/null; then
              echo "infra ready"
              exit 0
            fi
            sleep 2
          done
          echo "infra not ready" >&2
          docker compose ps
          exit 1

      - name: Integration tests
        env:
          RUN_INTEGRATION: '1'
          MONGO_URI: mongodb://localhost:27017/cxorbit?directConnection=true
          REDIS_URL: redis://localhost:6379
          NATS_URL: nats://localhost:4222
          POSTGRES_URL: postgres://cxorbit:cxorbit@localhost:5432/cxorbit
        run: pnpm test:integration

      - name: Tear down infra
        if: always()
        run: docker compose down -v

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: services/channel-gateway/Dockerfile
            tag: cxorbit/channel-gateway
          - file: services/conversation-service/Dockerfile
            tag: cxorbit/conversation-service
          - file: services/customer-service/Dockerfile
            tag: cxorbit/customer-service
          - file: services/ai-service/Dockerfile
            tag: cxorbit/ai-service
          - file: services/routing-service/Dockerfile
            tag: cxorbit/routing-service
          - file: services/outbound-service/Dockerfile
            tag: cxorbit/outbound-service
          - file: services/analytics-service/Dockerfile
            tag: cxorbit/analytics-service
          - file: services/incident-simulator/Dockerfile
            tag: cxorbit/incident-simulator
          - file: simulators/webchat-provider/Dockerfile
            tag: cxorbit/webchat-provider
          - file: frontend/Dockerfile
            tag: cxorbit/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.tag }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          tags: ${{ matrix.tag }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
