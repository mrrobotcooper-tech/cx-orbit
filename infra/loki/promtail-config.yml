# =====================================================================
# CX-ORBIT — Promtail configuration (Phase 1)
#
# Tails Docker container logs and ships them to Loki, so the logging
# pipeline is verifiable before any application service exists. Uses the
# Docker socket for service discovery and extracts useful labels.
# =====================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Only collect logs from containers in this project (cx-orbit).
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        regex: cx-orbit
        action: keep
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
    pipeline_stages:
      # App logs are JSON (Pino). Try to parse; non-JSON lines pass through.
      - json:
          expressions:
            level: level
            correlationId: correlationId
            traceId: traceId
          drop_malformed: false
      - labels:
          level:
